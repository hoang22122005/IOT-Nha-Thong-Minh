services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: iot-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-passwords:/mosquitto/secrets:ro
      - ./infra/mosquitto/data:/mosquitto/data

  redis:
    image: redis:7-alpine
    container_name: iot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  mongodb:
    image: mongo:7
    container_name: iot-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    container_name: iot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smarthome
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthome -d smarthome"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    image: maven:3.9.16-eclipse-temurin-17-alpine
    container_name: iot-backend
    restart: unless-stopped
    working_dir: /workspace
    command: ["mvn", "-DskipTests", "spring-boot:run"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MQTT_BROKER_URL: tcp://mqtt-broker:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-esp32}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      REDIS_HOST: redis
      MONGODB_URI: mongodb://mongodb:27017/smarthome
      POSTGRES_URL: jdbc:postgresql://postgres:5432/smarthome
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backend-iot:/workspace
      - maven-cache:/root/.m2
    depends_on:
      mqtt-broker:
        condition: service_started
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  mqtt-passwords:
    external: true
    name: iot_mqtt-passwords
  redis-data:
  mongo-data:
  postgres-data:
  maven-cache:
    external: true
    name: iot_maven-cache
