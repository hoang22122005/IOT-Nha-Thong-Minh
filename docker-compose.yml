services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: iot-mqtt-broker
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:-0.0.0.0}:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-passwords:/mosquitto/secrets:ro
      - ./infra/mosquitto/data:/mosquitto/data

  redis:
    image: redis:7-alpine
    container_name: iot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  mongodb:
    image: mongo:7
    container_name: iot-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    container_name: iot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthome}
      POSTGRES_USER: ${POSTGRES_USER:-smarthome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarthome} -d ${POSTGRES_DB:-smarthome}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    image: maven:3.9-eclipse-temurin-17
    container_name: iot-backend
    restart: unless-stopped
    working_dir: /workspace
    command: ["mvn", "-DskipTests", "spring-boot:run"]
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-80}:8080"
    environment:
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://mqtt-broker:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-esp32}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      IOT_HOME_ID: ${IOT_HOME_ID:-home-01}
      IOT_ROOM_ID: ${IOT_ROOM_ID:-room-01}
      IOT_ALLOWED_ORIGINS: ${IOT_ALLOWED_ORIGINS:-*}
      IOT_LOG_LEVEL: ${IOT_LOG_LEVEL:-DEBUG}
      SPRING_WEB_LOG_LEVEL: ${SPRING_WEB_LOG_LEVEL:-DEBUG}
      SPRING_WS_LOG_LEVEL: ${SPRING_WS_LOG_LEVEL:-DEBUG}
      REDIS_HOST: redis
      MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DATABASE:-smarthome}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smarthome}
      POSTGRES_USER: ${POSTGRES_USER:-smarthome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backend-iot:/workspace
      - maven-cache:/root/.m2
    depends_on:
      mqtt-broker:
        condition: service_started
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  mqtt-passwords:
    external: true
    name: iot_mqtt-passwords
  redis-data:
  mongo-data:
  postgres-data:
  maven-cache:
    external: true
    name: iot_maven-cache
