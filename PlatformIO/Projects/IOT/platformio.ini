[platformio]
extra_configs = platformio.local.ini
default_envs = esp32-s3-devkitc-1

# ========================================================
# Node ESP32: cảm biến DHT11, báo động tại chỗ và gửi MQTT
# ========================================================
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
# Let PlatformIO detect the ESP32 serial port; Windows may assign a new COM number.

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

# Chỉ biên dịch chương trình test trong main.cpp
build_src_filter = +<main.cpp> -<test_buzzer.cpp>

lib_deps =
    adafruit/Adafruit NeoPixel
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient
    bblanchon/ArduinoJson

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

# Local MQTT profile: uses include/secrets.local.h, so switching between local
# and VPS broker only requires selecting a profile and uploading that firmware.
[env:esp32-s3-local]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DIOT_USE_LOCAL_SECRETS=1

# Môi trường riêng cho ESP32 thứ hai. Chỉ upload profile này khi đã cắm đúng board node 2.
# Credentials Wi-Fi/MQTT vẫn lấy từ include/secrets.h; các ID node được override tại đây.
[env:esp32-s3-room-02]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DIOT_DEVICE_ID=\"esp32-room-02\"
    -DIOT_HOME_ID=\"home-01\"
    -DIOT_ROOM_ID=\"room-02\"
    -DIOT_SENSOR_ID=\"dht11-02\"
